services:
  # MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: gym_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gym_business_os
      MYSQL_USER: gym_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecretGymPass2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSecretGymPass2026!}
    volumes:
      - gym_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - gym_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend (PHP 8.2 FPM)
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.php
    container_name: gym_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gym_network

  # Queue Worker & Task Scheduler
  queue:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.php
    container_name: gym_queue_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gym_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gym_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../backend:/var/www/backend
      - ../frontend/dist:/var/www/frontend
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - gym_network

volumes:
  gym_db_data:

networks:
  gym_network:
    driver: bridge
