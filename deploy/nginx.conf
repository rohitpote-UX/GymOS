# -----------------------------------------------------------------------------
# GYM BUSINESS OS — PRODUCTION NGINX CONFIGURATION
# -----------------------------------------------------------------------------

# Upstream PHP-FPM pool
upstream php-fpm {
    server 127.0.0.1:9000;
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.yourgymdomain.com app.yourgymdomain.com;
    return 301 https://$host$request_uri;
}

# Backend API Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourgymdomain.com;

    root /var/www/gym-business-os/backend/public;
    index index.php;

    # SSL Certificates (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.yourgymdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourgymdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM execution
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Deny access to hidden files (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
